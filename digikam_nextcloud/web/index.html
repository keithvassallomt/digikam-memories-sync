<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="face-sync-token" content="__FACE_SYNC_TOKEN__">
  <title>Face Sync</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/screens.css">
</head>
<body>
  <header class="topbar">
    <button id="brand-home" class="brand" type="button">
      <span class="logo" aria-hidden="true">◎</span>
      <span class="brand-text">
        <strong>Face Sync</strong>
        <small>digiKam ↔ Memories</small>
      </span>
    </button>
    <div class="connection">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Starting…</span>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <button class="rail-item" type="button" data-nav="home" data-route="/">
        <span class="rail-icon" aria-hidden="true">⌂</span><span class="rail-label">Home</span>
      </button>
      <button class="rail-item" type="button" data-nav="activity">
        <span class="rail-icon" aria-hidden="true">≡</span><span class="rail-label">Activity</span>
      </button>
      <button class="rail-item" type="button" data-nav="attention">
        <span class="rail-icon" aria-hidden="true">!</span><span class="rail-label">Needs attention</span>
        <span id="attention-badge" class="badge" hidden>0</span>
      </button>
      <button class="rail-item" type="button" data-nav="logs">
        <span class="rail-icon" aria-hidden="true">▤</span><span class="rail-label">Logs</span>
      </button>
      <button class="rail-item" type="button" data-nav="settings">
        <span class="rail-icon" aria-hidden="true">⚙</span><span class="rail-label">Settings</span>
      </button>
      <div class="rail-footer">
        <span class="dot"></span>
        <span id="service-note">Running in the background</span>
      </div>
    </nav>
    <main id="screen"></main>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
