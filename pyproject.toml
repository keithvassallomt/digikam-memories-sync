[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "digimem"
dynamic = ["version"]
description = "Two-way face synchronization between digiKam and Nextcloud Memories"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
database = [
  "PyMySQL>=1.1.0",
  "psycopg2-binary>=2.9.9",
]
desktop = [
  "keyring>=25",
  "psutil>=5.9",
]
# The macOS build only. A notification with a button has to be posted by the
# application bundle, which means talking to UserNotifications directly.
macos = [
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-UserNotifications>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
digimem = "digimem.entrypoint:main"

[project.gui-scripts]
digimemw = "digimem.entrypoint:main"

[tool.setuptools.dynamic]
version = { attr = "digimem.__version__" }

[tool.setuptools.packages.find]
include = ["digimem*"]

[tool.setuptools.package-data]
digimem = [
  "icons/*",
  "web/*.html",
  "web/*.png",
  "web/css/*.css",
  "web/js/*.js",
  "web/js/views/*.js",
]
