[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digikam-memories-sync"
version = "0.1.0"
description = "Two-way face synchronization between digiKam and Nextcloud Memories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
database = [
  "PyMySQL>=1.1.0",
  "psycopg2-binary>=2.9.9",
]
desktop = [
  "keyring>=25",
  "watchdog>=6",
]

[project.scripts]
face-sync = "digikam_nextcloud.entrypoint:main"

[tool.setuptools.packages.find]
include = ["digikam_nextcloud*"]

[tool.setuptools.package-data]
digikam_nextcloud = [
  "web/*.html",
  "web/css/*.css",
  "web/js/*.js",
  "web/js/views/*.js",
]
