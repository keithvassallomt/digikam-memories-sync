[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digimem"
version = "0.1.0"
description = "Two-way face synchronization between digiKam and Nextcloud Memories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
database = [
  "PyMySQL>=1.1.0",
  "psycopg2-binary>=2.9.9",
]
desktop = [
  "keyring>=25",
  "psutil>=5.9",
]

[project.scripts]
digimem = "digimem.entrypoint:main"

[tool.setuptools.packages.find]
include = ["digimem*"]

[tool.setuptools.package-data]
digimem = [
  "icons/*",
  "web/*.html",
  "web/*.png",
  "web/css/*.css",
  "web/js/*.js",
  "web/js/views/*.js",
]
